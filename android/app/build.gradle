plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'pl.linguaforge.app'
    compileSdk 34

    defaultConfig {
        applicationId "pl.linguaforge.app"
        minSdk 24                 // Android 7.0 i nowsze
        targetSdk 34
        versionCode 1
        versionName "1.3.0"

        ndk {
            // architektury telefonów; arm64-v8a wystarczy dla urządzeń z ostatnich lat
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

chaquopy {
    defaultConfig {
        version "3.11"
        pip {
            // WAŻNE: pydantic 2 zawiera moduł kompilowany w Ruście i NIE instaluje się
            // na Androidzie. Poniższy zestaw jest w całości napisany w Pythonie
            // (czyste pakiety "py3-none-any") i został sprawdzony z tą aplikacją.
            install "fastapi==0.99.1"
            install "pydantic==1.10.13"
            install "starlette==0.27.0"
            install "uvicorn==0.22.0"
            install "anyio==3.7.1"
            install "sniffio==1.3.1"
            install "h11==0.14.0"
            install "click==8.1.7"
            install "idna==3.7"
            install "typing-extensions==4.12.2"
        }
        // katalog z kodem aplikacji (kopiowany skryptem przygotuj_zrodla)
        pyc { src false }
    }
    sourceSets {
        getByName("main") {
            srcDir "src/main/python"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
